name: Branch Gatekeeper & Copilot Review

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  # 1. Blocks anyone attempting a direct push, EXCEPT you
  block-direct-pushes:
    if: github.event_name == 'push' && github.actor != 'fixaro-ez'
    runs-on: ubuntu-latest
    steps:
      - name: Reject Push
        run: |
          echo "ERROR: Direct pushes to the main branch are completely disabled."
          echo "Please create a feature branch and open a Pull Request instead."
          exit 1

  # 2. Triggers Copilot if it is a legitimate Pull Request
  copilot-pr-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot Review
        uses: github/copilot-review-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

